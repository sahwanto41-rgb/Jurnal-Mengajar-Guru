<script>
const $=s=>document.querySelector(s);

const fd=d=>{if(!d)return'-';const[y,m,x]=d.split('-');return `${+x} ${BLN[m-1]} ${y}`};

try{const s=sessionStorage.getItem('jm_u');if(s)me=s}catch(e){}
const user=()=>st.users.find(u=>u.id===me);

async function save(){st.v++;const j=JSON.stringify(st);try{if(dbdoc)await dbdoc.set({j});else localStorage.setItem('jm_st',j)}catch(e){try{localStorage.setItem('jm_st',j)}catch(_){}toast('Data tersimpan lokal saja (tidak ada izin tulis bersama).')}}

 try{load(localStorage.getItem('jm_st'))}catch(e){}

 const M=u.role==='ks'?K:G;
 return `<header class="h"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5c2.5-1.5 5.5-1.5 8 0V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 5.5V19"/></svg></div><div><div class="m3r"><div class="m3d sm" role="img" aria-label="MANTRA"><span style="--i:0">M</span><span style="--i:1">A</span><span style="--i:2">N</span><span style="--i:3">T</span><span style="--i:4">R</span><span style="--i:5">A</span></div><span class="m3p"><b>M</b>engajar <b>A</b>ktif <b>N</b>yata <b>T</b>ercatat <b>R</b>api <b>A</b>kurat</span></div><b>Jurnal Mengajar Digital</b><small>UPTD SPF SD Negeri Lanas 1 · Tahun Pelajaran 2026/2027</small></div><div class="ur"><div class="nm">${esc(u.nama)}<br><a href="#" onclick="out();return false">Keluar</a></div><div class="av">${esc((u.nama||'?').trim().charAt(0).toUpperCase())}</div></div></header>
 <div class="wrap"><nav>${M.map(m=>`<a class="${route===m[0]?'on':''}" onclick="go('${m[0]}')">${m[1]} <span>${m[2]}</span></a>`).join('')}<a onclick="out()">🚪 <span>Keluar</span></a></nav><main>${body}</main></div>`}

function render(){
 const A=$('#app');
 if(!user()){A.innerHTML=`<div class="lg-bg"><div class="lg"><div class="lg-l"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1c00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5c2.5-1.5 5.5-1.5 8 0V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 5.5V19"/></svg></div><div><div class="m3d" role="img" aria-label="MANTRA"><span style="--i:0">M</span><span style="--i:1">A</span><span style="--i:2">N</span><span style="--i:3">T</span><span style="--i:4">R</span><span style="--i:5">A</span></div><div class="m3s"><b>M</b>engajar <b>A</b>ktif <b>N</b>yata <b>T</b>ercatat <b>R</b>api <b>A</b>kurat</div><h1>Jurnal Mengajar Digital</h1><p style="margin-top:10px">Pencatatan dan pemantauan kegiatan pembelajaran guru secara tertib, transparan, dan akuntabel.</p></div><p>UPTD SPF SD Negeri Lanas 1<br>Kec. Botolinggo · Kab. Bondowoso · Jawa Timur<br>Tahun Pelajaran 2026/2027</p></div><div class="lg-r"><h2>Masuk</h2><label for="lu">Username</label><input id="lu" autocapitalize="none" autocomplete="username"><br><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><br><button onclick="doLogin()">Masuk</button><p class="hint">Akun awal Kepala Sekolah: <b>kepsek</b> / <b>lanas1</b> (segera ubah di Pengaturan). Akun guru dibuat oleh Kepala Sekolah di menu Data Guru.</p></div></div></div>`;return}
 const u=user(),ks=u.role==='ks';
 const V={dash:ks?vDashK:vDashG,jurnal:vJurnal,form:vForm,rekap:vRekap,refl:vRefl,rform:vRForm,refk:vRefK,profil:vProfil,mon:vMon,rg:vRG,rp:vRP,lap:vLap,dg:vDG,set:vSet};
 A.innerHTML=shell((V[route]||vDashG)());
 if(route==='form')calc();
}
/* data helpers */
const mine=()=>user().role==='ks'?st.jr:st.jr.filter(j=>j.gid===me);
const gurus=()=>st.users.filter(u=>u.role==='guru');
const gn=id=>st.users.find(u=>u.id===id)?.nama||'-';
const ym=d=>d.slice(0,7);
function wd(from,to){let n=0,d=new Date(from+'T00:00:00'),e=new Date(to+'T00:00:00');for(;d<=e;d.setDate(d.getDate()+1)){const w=d.getDay();if(w>0&&w<6)n++}return n}
function stat(gid,ymk){const now=today(),first=ymk+'-01',lastD=new Date(+ymk.slice(0,4),+ymk.slice(5),0).getDate(),last=ymk+'-'+String(lastD).padStart(2,'0');const to=last<now?last:now;const rows=st.jr.filter(j=>j.gid===gid&&ym(j.tgl)===ymk);const days=new Set(rows.map(j=>j.tgl)).size;const eff=to>=first?wd(first,to):0;return{n:rows.length,days,eff,miss:Math.max(0,eff-days),pct:eff?Math.min(100,Math.round(days/eff*100)):0,hadir:rows.reduce((a,j)=>a+ +j.hadir,0),absen:rows.reduce((a,j)=>a+ +j.absen,0)}}
function chart(rows){const m={};rows.forEach(j=>m[ym(j.tgl)]=(m[ym(j.tgl)]||0)+1);const ks=Object.keys(m).sort();if(!ks.length)return'<p style="color:var(--m)">Belum ada data.</p>';const mx=Math.max(...ks.map(k=>m[k]));return `<div class="bar">${ks.map(k=>`<div>${m[k]}<i style="height:${m[k]/mx*100}%"></i>${BLN[+k.slice(5)-1]}</div>`).join('')}</div>`}
function warnToday(){const t=today(),w=new Date(t+'T00:00:00').getDay();if(w===0||w===6)return'';return st.jr.some(j=>j.gid===me&&j.tgl===t)?'':`<div class="al">⏰ Pengingat: jurnal hari ini (${fd(t)}) belum Anda isi. <a href="#" onclick="newJ();return false">Isi sekarang</a></div>`}
/* dashboards */
function vDashG(){const u=user(),k=ym(today()),s=stat(me,k);return `${hero('Ringkasan jurnal mengajar Anda bulan ini.')}${warnToday()}
<div class="card"><h3>${esc(u.nama)}</h3><div style="color:var(--m)">NIP/NUPTK: ${esc(u.nip||'-')} · Kelas: ${esc(u.kelas||'-')} · Mapel: ${esc(u.mapel||'-')}</div></div>
<div class="grid"><div class="st"><span>Jurnal bulan ini</span><b>${s.n}</b></div><div class="st o"><span>Hari sudah diisi</span><b>${s.days}</b></div><div class="st d"><span>Hari belum diisi</span><b>${s.miss}</b></div><div class="st w"><span>Keterlaksanaan</span><b>${s.pct}%</b></div></div>
<div class="card"><h3>Rekap Kehadiran/Mengajar Bulan Ini</h3>Total siswa hadir: <b>${s.hadir}</b> · Tidak hadir: <b>${s.absen}</b> · Hari efektif berjalan: <b>${s.eff}</b></div>
<div class="card"><h3>Aktivitas Mengajar per Bulan</h3>${chart(mine())}</div><button onclick="newJ()">＋ Tambah Jurnal</button>`}
function vDashK(){const k=ym(today()),G=gurus(),S=G.map(g=>({g,...stat(g.id,k)}));const belum=S.filter(x=>!st.jr.some(j=>j.gid===x.g.id&&j.tgl===today()));
 const avg=S.length?Math.round(S.reduce((a,x)=>a+x.pct,0)/S.length):0;
 return `${hero('Pantau kelengkapan jurnal seluruh guru secara real-time.')}<div class="grid"><div class="st"><span>Jumlah guru</span><b>${G.length}</b></div><div class="st o"><span>Jurnal bulan ini</span><b>${S.reduce((a,x)=>a+x.n,0)}</b></div><div class="st d"><span>Belum isi hari ini</span><b>${belum.length}</b></div><div class="st w"><span>Rata-rata keterlaksanaan</span><b>${avg}%</b></div></div>
 <div class="card"><h3>Guru Belum Mengisi Jurnal Hari Ini</h3>${belum.length?belum.map(x=>`<span class="tg no">${esc(x.g.nama)}</span> `).join(''):'<span class="tg ok">Semua guru sudah mengisi</span>'}</div>
 <div class="card"><h3>Grafik Aktivitas Mengajar per Bulan</h3>${chart(st.jr)}</div>
 <div class="card"><h3>Monitoring Keterlaksanaan Bulan Ini</h3>${tblStat(S)}</div>`}
function tblStat(S){return `<div class="tw"><table class="tS"><thead><tr><th>Guru</th><th>Jurnal</th><th>Hari terisi</th><th>Hari efektif</th><th>Belum isi</th><th>Keterlaksanaan</th></tr></thead><tbody>${S.map(x=>`<tr><td>${esc(x.g.nama)}</td><td>${x.n}</td><td>${x.days}</td><td>${x.eff}</td><td>${x.miss}</td><td><span class="tg ${x.pct>=80?'ok':x.pct<50?'no':''}">${x.pct}%</span></td></tr>`).join('')||'<tr><td colspan=6>Belum ada guru.</td></tr>'}</tbody></table></div>`}
/* jurnal guru */
function newJ(){edit={id:null,tgl:today(),jam:'',kelas:user().kelas?.split(',')[0]?.trim()||'',mapel:user().mapel||'',total:'',absen:0};route='form';render()}
function vJurnal(){const R=mine().sort((a,b)=>b.tgl.localeCompare(a.tgl)||a.jam.localeCompare(b.jam));return `<h2>Jurnal Mengajar</h2>${warnToday()}<button onclick="newJ()">＋ Tambah Jurnal</button> <button class="s" onclick="cetakBulan()">🖨️ Cetak Jurnal Bulan Ini</button><div class="card" style="margin-top:12px"><div class="tw"><table><tr><th>Tanggal</th><th>Kelas</th><th>Jam</th><th>Mapel</th><th>Materi</th><th>Hadir</th><th>Aksi</th></tr>${R.map(j=>`<tr><td>${fd(j.tgl)}</td><td>${esc(j.kelas)}</td><td>${esc(j.jam)}</td><td>${esc(j.mapel)}</td><td>${esc(j.materi)}</td><td>${j.hadir}/${j.total}${cmp(j)?'':' <span class="tg">belum lengkap</span>'}</td><td style="white-space:nowrap"><button class="s x" onclick="detail('${j.id}')">Detail</button> <button class="s x" onclick="editJ('${j.id}')">Edit</button> <button class="d x" onclick="delJ('${j.id}')">Hapus</button> <button class="s x" onclick="printJ('${j.id}')">Cetak</button></td></tr>`).join('')||'<tr><td colspan=7>Belum ada jurnal.</td></tr>'}</table></div></div>`}
const cmp=j=>j.materi&&j.tujuan&&j.kegiatan&&j.metode&&j.media&&j.total!==''
function editJ(id){edit={...st.jr.find(j=>j.id===id)};route='form';render()}
function delJ(id){if(!confirm('Hapus jurnal ini?'))return;const j=st.jr.find(x=>x.id===id);st.jr=st.jr.filter(x=>x.id!==id);lg('Hapus jurnal',fd(j.tgl)+' '+j.kelas+' jam '+j.jam);save();render()}
function vForm(){const e=edit,u=user(),k=u.kelas?u.kelas.split(',').map(x=>x.trim()):[];
 const T=(id,l,rows,v)=>`<div class="w2"><label>${l}</label><textarea id="${id}" rows="${rows}">${esc(v)}</textarea></div>`;
 const pl=e.id?[]:(st.ma||[]).filter(m=>m.gid===me).sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||'')),
 used=new Set((st.jr||[]).filter(j=>j.gid===me&&j.maid).map(j=>j.maid)),
 PK=pl.length?`<div class="w2" style="background:#eef6ff;border-radius:10px;padding:10px"><label>Isi otomatis dari rencana (Planner Perangkat Ajar)</label><select id="plan" onchange="fillPlan(this.value)"><option value="">— pilih rencana (${pl.length}) —</option>${pl.map(m=>`<option value="${esc(m.id)}">${esc(fd(m.tgl))} · Kelas ${esc(m.kelas)} · ${esc(m.mapel)} · ${esc(m.materi)}${used.has(m.maid)?' (sudah dijadikan jurnal)':''}</option>`).join('')}</select></div>`:'';
 return `<h2>${e.id?'Edit':'Tambah'} Jurnal Mengajar</h2><div class="card"><div class="f">${PK}
 <div><label>Tanggal</label><input type="date" id="tgl" value="${e.tgl}" onchange="$('#hari').value=hariOf(this.value)"></div>
 <div><label>Hari</label><input id="hari" readonly value="${hariOf(e.tgl)}"></div>
 <div><label>Nama Guru</label><input readonly value="${esc(u.nama)}"></div>
 <div><label>Kelas</label>${k.length>1?`<select id="kelas" onchange="$('#fase').value=FASE[this.value.replace(/\D/g,'')]||''">${k.map(x=>`<option ${x===e.kelas?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="kelas" value="${esc(e.kelas)}" placeholder="mis. 4" oninput="$('#fase').value=FASE[this.value.replace(/\D/g,'')]||''">`}</div>
 <div><label>Mata Pelajaran</label><input id="mapel" value="${esc(e.mapel)}"></div>
 <div><label>Fase</label><input id="fase" value="${esc(e.fase||FASE[(e.kelas||'').replace(/\D/g,'')]||'')}"></div>
 <div><label>Jam ke-</label><input id="jam" value="${esc(e.jam)}" placeholder="mis. 1-2"></div>
 <div><label>Jumlah siswa kelas</label><input id="total" type="number" min="0" value="${e.total}" oninput="calc()"></div>
 <div><label>Siswa tidak hadir</label><input id="absen" type="number" min="0" value="${e.absen}" oninput="calc()"></div>
 <div><label>Siswa hadir (otomatis)</label><input id="hadir" readonly></div>
 ${T('materi','Materi/Topik Pembelajaran',2,e.materi)}${T('tujuan','Tujuan Pembelajaran',2,e.tujuan)}${T('kegiatan','Kegiatan Pembelajaran',3,e.kegiatan)}
 <div><label>Metode/Model Pembelajaran</label><input id="metode" value="${esc(e.metode)}"></div><div><label>Media/Sumber Belajar</label><input id="media" value="${esc(e.media)}"></div>
 ${T('kendala','Kendala/Hambatan',2,e.kendala)}${T('tl','Tindak Lanjut',2,e.tl)}${T('catatan','Catatan Guru',2,e.catatan)}
 <div class="w2"><label>Dokumentasi kegiatan (opsional)</label><input type="file" accept="image/*" onchange="pic(this)"><img id="pv0" src="${e.foto||''}" style="max-width:160px;margin-top:6px;border-radius:8px;${e.foto?'':'display:none'}"></div>
 </div><br><button onclick="saveJ()">💾 Simpan</button> <button class="s" onclick="go('jurnal')">Batal</button></div>`}
function calc(){const t=+$('#total').value||0,a=+$('#absen').value||0;$('#hadir').value=Math.max(0,t-a);if(a>t)$('#absen').style.borderColor='var(--r)';else $('#absen').style.borderColor=''}
let foto='';function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);foto=c.toDataURL('image/jpeg',.6);$('#pv0').src=foto;$('#pv0').style.display='block'};im.src=r.result};r.readAsDataURL(f)}
function fillPlan(id){const m=(st.ma||[]).find(x=>x.id===id);if(!m)return;const set=(k,v)=>{const el=$('#'+k);if(el&&v!=null)el.value=v};
 set('tgl',m.tgl);set('hari',hariOf(m.tgl));set('kelas',m.kelas);set('fase',m.fase||FASE[String(m.kelas).replace(/\D/g,'')]||'');set('mapel',m.mapel);
 set('materi',m.materi);set('tujuan',m.tujuan);set('kegiatan',m.kegiatan);set('metode',m.metode);set('media',m.media);edit.maid=m.maid;toast('Terisi dari rencana. Lengkapi jam ke-, jumlah siswa, dan kehadiran.')}
function saveJ(){const g=id=>$('#'+id).value.trim(),e=edit;
 const o={id:e.id||uid(),gid:me,tgl:g('tgl'),kelas:g('kelas'),mapel:g('mapel'),fase:g('fase'),jam:g('jam'),total:g('total'),absen:+g('absen')||0,materi:g('materi'),tujuan:g('tujuan'),kegiatan:g('kegiatan'),metode:g('metode'),media:g('media'),kendala:g('kendala'),tl:g('tl'),catatan:g('catatan'),foto:foto||e.foto||'',maid:e.maid||''};
 if(!o.tgl||!o.kelas||!o.mapel||!o.jam)return toast('Tanggal, kelas, mata pelajaran, dan jam ke- wajib diisi.');
 if(+o.absen>+o.total)return toast('Siswa tidak hadir tidak boleh melebihi jumlah siswa.');
 if(st.jr.some(j=>j.id!==o.id&&j.gid===me&&j.tgl===o.tgl&&j.kelas.toLowerCase()===o.kelas.toLowerCase()&&j.jam===o.jam))return toast('Jurnal ganda: sudah ada jurnal pada tanggal, kelas, dan jam yang sama.');
 o.hadir=Math.max(0,+o.total-o.absen);o.upd=new Date().toISOString();foto='';
 const i=st.jr.findIndex(j=>j.id===o.id);if(i>=0)st.jr[i]=o;else st.jr.push(o);
 lg(i>=0?'Edit jurnal':'Tambah jurnal',fd(o.tgl)+' '+o.kelas+' jam '+o.jam);save();
 if(!cmp(o))toast('Jurnal tersimpan, namun data belum lengkap (materi, tujuan, kegiatan, metode, media, jumlah siswa). Mohon dilengkapi.');
 go('jurnal')}
/* detail / print */
function jHTML(j){const r=(a,b)=>`<tr><th>${a}</th><td>${esc(b)||'-'}</td></tr>`;return `<h3>Jurnal Mengajar – ${esc(gn(j.gid))}</h3><table class="tD">${r('Hari/Tanggal',hariOf(j.tgl)+', '+fd(j.tgl))}${r('Kelas / Fase',j.kelas+' / '+j.fase)}${r('Mata Pelajaran',j.mapel)}${r('Jam ke-',j.jam)}${r('Materi',j.materi)}${r('Tujuan',j.tujuan)}${r('Kegiatan',j.kegiatan)}${r('Metode/Model',j.metode)}${r('Media/Sumber',j.media)}${r('Siswa hadir / tidak hadir',j.hadir+' / '+j.absen+' (dari '+j.total+')')}${r('Kendala',j.kendala)}${r('Tindak lanjut',j.tl)}${r('Catatan',j.catatan)}${r('Terakhir diperbarui',new Date(j.upd).toLocaleString('id-ID'))}</table>${j.foto?`<img class="ft" src="${j.foto}" style="max-width:240px;margin-top:8px">`:''}`}

 return `<h2>Jurnal Refleksi Guru</h2><div class="al" style="background:var(--c);border-left-color:var(--p);color:var(--t)">Refleksi disimpan terpisah dan tidak mengubah isi Jurnal Mengajar yang sudah Anda isi.</div><div class="row"><button onclick="newR()">➕ Tambah Refleksi</button><button class="s" onclick="printR(me)">🖨️ Cetak</button></div><div class="card"><div class="tw">${R.length?rTbl(R,1):'<p style="color:var(--m)">Belum ada refleksi.</p>'}</div></div>`}
function vRForm(){const e=rEdit,J=st.jr.filter(j=>j.gid===me).sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,40);
 const T=(id,l,v,ph)=>`<div class="w2"><label style="color:var(--t);font-weight:700">${l}</label><small style="display:block;color:var(--m);margin:0 0 4px">${ph}</small><textarea id="${id}" rows="3">${esc(v)}</textarea></div>`;
 return `<h2>${e.id?'Edit':'Tambah'} Refleksi</h2><div class="card"><div id="rref">${refBox(e.jid)}</div><div class="f"><div><label>Tanggal</label><input type="date" id="rt" value="${e.tgl}"></div><div><label>Jurnal terkait (opsional)</label><select id="rj" onchange="rPick(this.value)"><option value="">– Refleksi umum –</option>${J.map(j=>`<option value="${j.id}" ${j.id===e.jid?'selected':''}>${fd(j.tgl)} · Kelas ${esc(j.kelas)} · ${esc(j.mapel)} · ${esc((j.materi||'').slice(0,35))}</option>`).join('')}</select></div><div><label>Kelas</label><input id="rk" value="${esc(e.kelas)}"></div><div><label>Mata Pelajaran</label><input id="rm" value="${esc(e.mapel)}"></div><div><label>Ketercapaian tujuan pembelajaran</label><select id="rs">${SK.map(x=>`<option ${x===e.skala?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="w2" style="margin-top:6px"><h3 style="margin:0 0 6px">Isi Refleksi</h3><button class="s" type="button" onclick="rPick($('#rj').value)">↻ Isi otomatis dari jurnal terkait</button> <small style="color:var(--m)">Isian kosong akan diisi dari jurnal, lalu bisa Anda ubah.</small></div>${T('rb','1. Hal yang berjalan baik',e.baik,'Contoh: strategi, kegiatan, atau media yang efektif. Terisi otomatis dari metode, media, dan kegiatan jurnal.')}${T('rc','2. Tantangan / hal yang belum optimal',e.tantangan,'Terisi otomatis dari Kendala jurnal. Sesuaikan dengan kondisi kelas.')}${T('rr','3. Respons dan keterlibatan murid',e.respons,'Terisi otomatis dari kehadiran dan catatan guru di jurnal. Tambahkan pemahaman dan partisipasi murid.')}${T('rx','4. Rencana perbaikan pembelajaran berikutnya',e.rtl,'Terisi otomatis dari Tindak lanjut jurnal. Tulis langkah konkret.')}
 </div><br><button onclick="saveR()">💾 Simpan</button> <button class="s" onclick="go('refl')">Batal</button></div>`}
let rAuto={};
const rBaik=j=>{const a=[];a.push('Pembelajaran'+(j.materi?' "'+j.materi+'"':'')+' dilaksanakan dengan '+(j.metode||'metode yang direncanakan')+(j.media?', berbantuan '+j.media:'')+'.');if(j.kegiatan)a.push('Kegiatan: '+j.kegiatan+'.');return a.join(' ')};
const rResp=j=>{const t=+j.total||0,ab=+j.absen||0,h=j.hadir!==undefined&&j.hadir!==''?+j.hadir:Math.max(0,t-ab);let x=t?'Kehadiran murid '+h+' dari '+t+' siswa ('+Math.round(h/t*100)+'%)'+(ab?', '+ab+' siswa tidak hadir':'')+'.':'';if(j.catatan)x+=(x?' ':'')+'Catatan guru: '+j.catatan;return x};
const refBox=id=>{const j=st.jr.find(x=>x.id===id);if(!j)return '<p style="color:var(--m);font-size:13px;margin:0 0 14px">Pilih jurnal terkait untuk menampilkan ringkasan sebagai acuan refleksi.</p>';
 const r=(a,b)=>`<div style="margin-bottom:6px"><b>${a}:</b> ${esc(b)||'-'}</div>`;
 return `<div style="background:var(--bg);border-left:4px solid var(--p);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px"><div style="font-weight:700;margin-bottom:8px">Ringkasan jurnal mengajar (acuan, tidak berubah)</div>${r('Materi',j.materi)}${r('Tujuan',j.tujuan)}${r('Kegiatan',j.kegiatan)}${r('Kendala',j.kendala)}${r('Tindak lanjut',j.tl)}${maBox(j)}<div style="color:var(--m);margin-top:8px">Kolom <b>Berjalan baik</b>, <b>Tantangan</b>, <b>Respons murid</b>, dan <b>Rencana perbaikan</b> terisi otomatis dari jurnal. Silakan sesuaikan dengan kondisi riil di kelas.</div></div>`};
const mDg=x=>String(x||'').replace(/\D/g,''),mLw=x=>String(x||'').toLowerCase().trim();
const maOf=j=>{const L=(st.ma||[]).filter(m=>m.gid===j.gid);return L.find(m=>j.maid&&m.maid===j.maid)||L.find(m=>m.tgl===j.tgl&&mDg(m.kelas)===mDg(j.kelas)&&mLw(m.mapel)===mLw(j.mapel))};
const maBox=j=>{const m=maOf(j);if(!m)return '';const r=(a,b)=>`<div style="margin-bottom:6px"><b>${a}:</b> ${esc(b)||'-'}</div>`;return `<div style="border-top:1px dashed #9bb;margin:10px 0 8px;padding-top:8px"><div style="font-weight:700;margin-bottom:6px">Modul ajar terkait: ${esc(m.docTitle||'')}</div>${r('Tujuan pembelajaran (rencana)',m.tujuan)}${r('Kriteria ketercapaian (pedoman mengisi skala)',m.kriteria)}</div>`};
function rPick(id){const j=st.jr.find(x=>x.id===id);$('#rref').innerHTML=refBox(id);if(!j)return;$('#rt').value=j.tgl;$('#rk').value=j.kelas;$('#rm').value=j.mapel;
 [['rb',rBaik(j)],['rc',j.kendala],['rr',rResp(j)],['rx',j.tl]].forEach(([i,v])=>{const el=$('#'+i);if(!el.value.trim()||el.value===rAuto[i]){el.value=v||'';rAuto[i]=v||''}})}
function saveR(){const g=i=>$('#'+i).value.trim(),e=rEdit;if(!g('rt')||!g('rk')||!(g('rb')||g('rc')||g('rr')||g('rx')))return toast('Tanggal, kelas, dan minimal satu isian refleksi wajib diisi.');
 const o={id:e.id||uid(),gid:me,tgl:g('rt'),jid:g('rj'),maid:((st.jr.find(x=>x.id===g('rj'))||{}).maid)||(e&&e.maid)||'',kelas:g('rk'),mapel:g('rm'),skala:g('rs'),baik:g('rb'),tantangan:g('rc'),respons:g('rr'),rtl:g('rx'),upd:new Date().toISOString()};
 const L=RL(),i=L.findIndex(x=>x.id===o.id);if(i>=0)L[i]=o;else L.push(o);lg(e.id?'Edit refleksi':'Tambah refleksi',fd(o.tgl)+' kelas '+o.kelas);rEdit=null;save();go('refl');toast('Refleksi tersimpan.')}
function delR(id){if(!confirm('Hapus refleksi ini?'))return;st.rf=RL().filter(x=>x.id!==id);(st.del=st.del||[]).push(id);lg('Hapus refleksi','');save();render()}

function printR(gid){const ks=user().role==='ks',k=ks?(flt.bl||''):'',R=RL().filter(r=>(!gid||r.gid===gid)&&(!k||ym(r.tgl)===k)).sort((a,b)=>a.tgl.localeCompare(b.tgl));if(!R.length)return toast('Belum ada refleksi untuk dicetak.');
 const g=gid&&st.users.find(u=>u.id===gid),per=k?blf(k):'Seluruh periode',r=(a,b)=>`<tr><td style="border:0;width:120px;padding:2px 4px">${a}</td><td style="border:0;padding:2px 4px">: ${b}</td></tr>`;
 if(g)doPrint(kop('JURNAL REFLEKSI GURU')+`<table style="width:auto;margin-bottom:10px">${r('Nama Guru',esc(g.nama))}${r('NIP/NUPTK',dash(g.nip))}${r('Jabatan',esc(gLabel(g)))}${r('Periode',esc(per))}</table>`+rTbl(R,0)+`<p>Total refleksi: <b>${R.length}</b></p>`+sigGuru(g),1,1);
 else doPrint(kop('REKAP JURNAL REFLEKSI GURU')+`<p>Periode: ${esc(per)}</p>`+rTbl(R,0,1)+sig(),1,1)}

const API='https://script.google.com/macros/s/AKfycbxUvdh63lky1evBhSJwKy345l2_m6LVU3hPb0TVmwRhTfnFHaN4pIYzTIjZYwtcMX4M/exec';
async function pull(){const r=await fetch(API);const o=await r.json();return o.j?JSON.parse(o.j):null}
function merge(r,l){if(!r)return l;const del=new Set([...(r.del||[]),...(l.del||[])]);
 const mm=(a,b,k)=>{const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{const y=m.get(k(x));const rc=o=>Object.values(o).filter(v=>v&&v!=='Kepala Sekolah').length;if(!y||(x.upd||'')>(y.upd||'')||((x.upd||'')===(y.upd||'')&&rc(x)>=rc(y)))m.set(k(x),x)});return[...m.values()]};
 return{v:Math.max(r.v||0,l.v||0),del:[...del],rf:mm(r.rf,l.rf,x=>x.id).filter(j=>!del.has(j.id)),users:mm(r.users,l.users,x=>x.id).filter(u=>!del.has(u.id)),jr:mm(r.jr,l.jr,x=>x.id).filter(j=>!del.has(j.id)),ma:mm(r.ma,l.ma,x=>x.id).filter(j=>!del.has(j.id)),log:mm(r.log,l.log,x=>x.t+x.u+x.a).sort((a,b)=>b.t.localeCompare(a.t)).slice(0,300)}}
async function save(){st.v++;try{const r=await pull();st=merge(r,st);await fetch(API,{method:'POST',body:JSON.stringify(st)})}catch(e){toast('Gagal menyimpan ke Google Sheets. Periksa koneksi dan URL Web App.')}}
function delJ(id){if(!confirm('Hapus jurnal ini?'))return;const j=st.jr.find(x=>x.id===id);st.jr=st.jr.filter(x=>x.id!==id);(st.del=st.del||[]).push(id);lg('Hapus jurnal',fd(j.tgl)+' '+j.kelas+' jam '+j.jam);save();render()}
function delG(id){const g=st.users.find(u=>u.id===id);if(!confirm('Hapus guru '+g.nama+'? Jurnalnya tetap tersimpan.'))return;st.users=st.users.filter(u=>u.id!==id);(st.del=st.del||[]).push(id);lg('Hapus guru',g.nama);save();render()}
function dl(name,html){const b=new Blob(['<html><head><meta charset="utf-8"></head><body>'+html+'</body></html>'],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
async function init(){render();try{const r=await pull();if(r){st=merge(r,st);render()}}catch(e){toast('Tidak bisa terhubung ke Google Sheets. Periksa URL Web App.')}
 setInterval(async()=>{if(route==='form'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))return;try{const r=await pull();if(r){st=merge(r,st);render()}}catch(e){}},60000)}
init();
